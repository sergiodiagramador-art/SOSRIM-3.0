<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SOSRIM</title>
    <!-- USANDO O PACOTE COMPLETO PARA EVITAR ERROS DE CARREGAMENTO -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/8.10.0/firebase.js"></script>
    <style>
        :root { --blue: #2563eb; --bg: #f8fafc; }
        body { margin: 0; font-family: Arial, sans-serif; background: var(--blue); color: white; text-align: center; }
        .container { padding: 40px 20px; }
        .btn-user { width: 100%; padding: 20px; background: white; color: var(--blue); border: none; border-radius: 20px; font-weight: 900; font-size: 20px; margin-bottom: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        #log { font-size: 11px; color: rgba(255,255,255,0.6); margin-top: 30px; text-align: left; font-family: monospace; }
    </style>
</head>
<body>
    <div id="app" class="container">
        <h1 style="font-size: 50px; font-weight: 900; margin-bottom: 5px;">SOSRIM</h1>
        <p id="status">Conectando ao Banco...</p>
        
        <div id="users" style="display:none; margin-top:30px;">
            <p>Escolha seu nome:</p>
            <button onclick="login('Sergio')" class="btn-user">Sergio</button>
            <button onclick="login('Aderildo')" class="btn-user">Aderildo</button>
            <button onclick="login('Jairo')" class="btn-user">Jairo</button>
        </div>

        <div id="log"></div>
    </div>

    <script>
        function log(msg) { document.getElementById('log').innerHTML += "> " + msg + "<br>"; }

        const config = {
            apiKey: "AIzaSyA896LR0DJv-TKqwt_DpkgO1MeaRKdKwP4",
            databaseURL: "https://sosrim-592ab-default-rtdb.firebaseio.com",
            projectId: "sosrim-592ab"
        };

        try {
            if (typeof firebase !== 'undefined') {
                firebase.initializeApp(config);
                const db = firebase.database();
                log("Firebase inicializado.");

                // TESTE DE CONEXÃO EM TEMPO REAL
                db.ref('.info/connected').on('value', (snap) => {
                    if (snap.val() === true) {
                        document.getElementById('status').innerHTML = "CONECTADO ✅";
                        document.getElementById('users').style.display = 'block';
                        log("Conexão com o banco OK!");
                    } else {
                        log("Tentando estabelecer conexão...");
                    }
                });

                // Alerta se demorar mais de 7 segundos
                setTimeout(() => {
                    if (document.getElementById('users').style.display === 'none') {
                        document.getElementById('status').innerHTML = "⚠️ ERRO DE REDE<br><small>O banco de dados não respondeu.</small>";
                        log("Tempo de espera esgotado.");
                    }
                }, 7000);

            } else {
                log("ERRO: Biblioteca Firebase não carregada.");
            }
        } catch (e) {
            log("FALHA: " + e.message);
        }

        window.login = (u) => {
            localStorage.setItem('sosrim_user', u);
            document.getElementById('app').innerHTML = `<h1>Bem-vindo, ${u}!</h1><p>Entrando no sistema...</p>`;
            setTimeout(() => location.reload(), 1000);
        };
    </script>
</body>
</html>
