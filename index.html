<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SOSRIM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, set, push, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // SUA CONFIGURAÇÃO DO FIREBASE (sosrim-592ab)
        const firebaseConfig = {
            apiKey: "AIzaSyB_REPLACE_WITH_REAL_KEY",
            authDomain: "sosrim-592ab.firebaseapp.com",
            databaseURL: "https://sosrim-592ab-default-rtdb.firebaseio.com",
            projectId: "sosrim-592ab",
            storageBucket: "sosrim-592ab.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.state = {
            user: localStorage.getItem('sosrim_user') || null,
            machines: {},
            hospitals: {},
            history: [],
            currentTab: 1,
            currentLocationName: 'Rua Buenos Aires, 792',
            showGpsPrompt: false,
            quickStatusId: null,
            tempStatus: null,
            tempHosp: null,
            tempTime: null
        };

        const render = () => {
            const appDiv = document.getElementById('app');
            if (!window.state.user) { renderLogin(appDiv); return; }
            renderMain(appDiv);
            if (window.lucide) lucide.createIcons();
        };

        const renderLogin = (container) => {
            container.innerHTML = `
                <div class="min-h-screen flex items-center justify-center bg-gray-50 p-6 font-sans">
                    <div class="bg-white p-8 rounded-[40px] shadow-2xl w-full max-w-md text-center border-t-8 border-blue-600">
                        <div class="text-7xl mb-6">🚑</div>
                        <h1 class="text-4xl font-black text-blue-900 mb-2 tracking-tighter uppercase">SOSRIM</h1>
                        <p class="text-gray-400 mb-10 font-medium">Controle de Logística</p>
                        <div class="space-y-4">
                            ${['Sergio', 'Aderildo', 'Jairo'].map(name => `
                                <button onclick="login('${name}')" class="w-full py-5 bg-blue-600 text-white rounded-2xl font-black text-xl shadow-lg shadow-blue-100 active:scale-95 transition-all uppercase tracking-widest">
                                    ${name}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        };

        window.login = (name) => { window.state.user = name; localStorage.setItem('sosrim_user', name); render(); };
        window.logout = () => { localStorage.removeItem('sosrim_user'); window.state.user = null; render(); };
        window.setTab = (t) => { window.state.currentTab = t; render(); };

        const renderMain = (container) => {
            container.innerHTML = `
                <div class="min-h-screen bg-gray-50 pb-28 font-sans">
                    <header class="bg-white p-5 shadow-sm flex justify-between items-center sticky top-0 z-40">
                        <div class="flex items-center gap-2">
                            <span class="text-2xl">🚑</span>
                            <h1 class="font-black text-2xl text-blue-900 tracking-tighter">SOSRIM</h1>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="bg-blue-600 text-white px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest shadow-md shadow-blue-100">${window.state.user}</span>
                            <button onclick="logout()" class="text-gray-300"><i data-lucide="log-out" class="w-5 h-5"></i></button>
                        </div>
                    </header>
                    <main class="p-4">${renderTabContent()}</main>
                    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 flex justify-around p-3 pb-8 shadow-[0_-10px_30px_rgba(0,0,0,0.05)] z-40">
                        ${[1, 2, 3, 4, 5].map(t => `
                            <button onclick="setTab(\({t})" class="flex flex-col items-center p-2 transition-all \){window.state.currentTab === t ? 'text-blue-600 scale-110' : 'text-gray-300'}">
                                <i data-lucide="\({['grid', 'map', 'hospital', 'list', 'history'][t-1]}" class="\){window.state.currentTab === t ? 'w-7 h-7' : 'w-6 h-6'}"></i>
                            </button>
                        `).join('')}
                    </nav>
                </div>
            `;
        };

        const renderTabContent = () => {
            switch(window.state.currentTab) {
                case 1: return renderTab1();
                case 2: return renderTab2();
                case 3: return renderTab3();
                case 4: return renderTab4();
                case 5: return renderTab5();
                default: return renderTab1();
            }
        };

        const getStatusClass = (status) => {
            switch(status) {
                case 'verde': return 'bg-green-500 text-white';
                case 'amarelo': return 'bg-yellow-400 text-black';
                case 'vermelho': return 'bg-red-500 text-white';
                case 'azul': return 'bg-blue-500 text-white';
                case 'roxo': return 'bg-purple-500 text-white';
                default: return 'bg-white text-gray-300';
            }
        };

        const renderTab1 = () => {
            const machines = Object.values(window.state.machines).sort((a,b) => a.id - b.id);
            return `
                <div class="grid grid-cols-3 gap-3">
                    ${machines.map(m => `
                        <div onclick="openQuickStatus('\({m.id}')" class="aspect-square rounded-2xl p-3 flex flex-col justify-between shadow-md relative overflow-hidden transition-all active:scale-95 border-2 \){m.status === 'vermelho' ? 'border-red-500' : 'border-transparent'} ${getStatusClass(m.status)}">
                            <div class="text-[10px] font-black opacity-60">#${m.id}</div>
                            <div class="flex flex-col items-center justify-center flex-1 text-center">
                                <span class="text-[9px] font-bold truncate w-full opacity-90 mb-1 uppercase leading-tight">${m.hospital || 'BASE'}</span>
                                <span class="text-2xl font-black leading-none tracking-tighter">${m.time || '--:--'}</span>
                            </div>
                            ${m.status === 'vermelho' ? '<div class="absolute inset-0 bg-red-600 animate-pulse opacity-20 pointer-events-none"></div>' : ''}
                        </div>
                    `).join('')}
                </div>
                ${window.state.quickStatusId ? renderQuickStatusSelector() : ''}
                ${window.state.showGpsPrompt ? renderGpsPrompt() : ''}
            `;
        };

        window.openQuickStatus = (id) => {
            const m = window.state.machines[id];
            if (!m) return;
            window.state.quickStatusId = id;
            window.state.tempStatus = m.status;
            window.state.tempHosp = m.hospital;
            window.state.tempTime = m.time;
            render();
        };

        window.closeQuickStatus = () => { window.state.quickStatusId = null; render(); };
        window.selectStatus = (s) => { window.state.tempStatus = s; render(); };
        window.selectHosp = (h) => { window.state.tempHosp = h; render(); };

        window.confirmUpdate = (id) => {
            const timeVal = document.getElementById('tempTime').value || '00:00';
            update(ref(db, `machines/${id}`), { status: window.state.tempStatus, hospital: window.state.tempHosp, time: timeVal });
            push(ref(db, 'history'), { driver: window.state.user, timestamp: new Date().toLocaleTimeString('pt-BR'), action: "MÁQUINA", details: `MAQ#\({id} em \){window.state.tempHosp} (${window.state.tempStatus.toUpperCase()})` });
            window.state.quickStatusId = null;
            render();
        };

        const renderQuickStatusSelector = () => {
            const m = window.state.machines[window.state.quickStatusId];
            const statusOptions = [{id:'verde',label:'Base',color:'bg-green-500'},{id:'amarelo',label:'Rua',color:'bg-yellow-400'},{id:'vermelho',label:'Recolher',color:'bg-red-500'},{id:'azul',label:'Saindo',color:'bg-blue-500'},{id:'roxo',label:'Voltando',color:'bg-purple-500'}];
            const hospitals = ['Erasto Gaertner', 'Erastinho', 'Marcelino Champagnat', 'Nações', 'Oswaldo Cruz', 'Fraturas XV', 'Pilar', 'Graças', 'Nossa Saúde', 'INC Campo Comprido', 'Maternidade Trabalhador', 'Marillac', 'Papa Francisco', 'Yoshimi', 'Alberto', 'BASE'];

            return `
                <div class="fixed inset-0 bg-black/70 backdrop-blur-md z-50 flex items-end">
                    <div class="bg-white w-full p-6 rounded-t-[40px] animate-slide-up max-h-[90vh] overflow-y-auto pb-12 text-center">
                        <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-6"></div>
                        <h3 class="text-2xl font-black text-blue-900 mb-6 italic underline tracking-tighter uppercase">Máquina #${m.id}</h3>
                        <div class="grid grid-cols-2 gap-2 mb-6">
                            ${statusOptions.map(opt => `
                                <button onclick="selectStatus('\({opt.id}')" class="flex items-center gap-2 p-3 rounded-2xl border-2 \){window.state.tempStatus === opt.id ? 'border-blue-600 bg-blue-50' : 'border-gray-50'}">
                                    <div class="w-4 h-4 rounded-full ${opt.color}"></div>
                                    <span class="font-black text-[10px] uppercase">${opt.label}</span>
                                </button>
                            `).join('')}
                        </div>
                        <div class="mb-6">
                            <div class="grid grid-cols-2 gap-1 max-h-40 overflow-y-auto bg-gray-50 p-2 rounded-2xl">
                                \({hospitals.map(h => `<button onclick="selectHosp('\){h}')" class="p-3 rounded-xl font-black text-[10px] border \({window.state.tempHosp === h ? 'bg-blue-600 text-white' : 'bg-white text-gray-500'}">\){h}</button>`).join('')}
                            </div>
                        </div>
                        <input id="tempTime" type="time" value="${window.state.tempTime || '00:00'}" class="w-full bg-gray-50 p-4 rounded-2xl font-black text-3xl text-center mb-6 border-none text-blue-900">
                        <div class="flex gap-4">
                            <button onclick="closeQuickStatus()" class="flex-1 font-bold text-gray-400">Voltar</button>
                            <button onclick="confirmUpdate('${m.id}')" class="flex-[2] bg-blue-600 text-white p-5 rounded-3xl font-black shadow-lg">CONFIRMAR OK</button>
                        </div>
                    </div>
                </div>
            `;
        };

        const renderGpsPrompt = () => `
            <div class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[100] flex items-center justify-center p-6">
                <div class="bg-white w-full rounded-[40px] p-10 shadow-2xl text-center">
                    <div class="text-6xl mb-6">📍</div>
                    <h3 class="text-2xl font-black text-blue-900 mb-2">Você está no Hospital?</h3>
                    <p class="text-gray-400 mb-10">O que deseja registrar agora?</p>
                    <div class="grid grid-cols-1 gap-3">
                        <button onclick="window.state.showGpsPrompt=false;render()" class="bg-blue-600 text-white p-5 rounded-3xl font-black">ENTREGAR MÁQUINAS</button>
                        <button onclick="window.state.showGpsPrompt=false;render()" class="bg-red-500 text-white p-5 rounded-3xl font-black">RECOLHER MÁQUINAS</button>
                        <button onclick="window.state.showGpsPrompt=false;render()" class="mt-4 text-gray-300 font-bold uppercase text-xs">Ignorar</button>
                    </div>
                </div>
            </div>
        `;

        const renderTab5 = () => {
            const hist = window.state.history || [];
            return `
                <div class="p-6 bg-white min-h-screen" style="font-family: Arial, sans-serif;">
                    <h2 class="text-3xl font-black border-b-8 border-black pb-4 mb-10 text-blue-900 uppercase">RELATÓRIO</h2>
                    <div class="space-y-8">
                        ${hist.slice().reverse().map(l => `
                            <div class="border-b-2 border-gray-50 pb-6">
                                <div class="flex justify-between text-[10px] font-black text-gray-400 mb-2 uppercase"><span>\({l.driver}</span><span>\){l.timestamp}</span></div>
                                <p class="text-[18px] font-bold text-gray-900 uppercase"><span class="text-blue-600">\({l.action}:</span> \){l.details}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        };

        const renderTab2 = () => `<div class="p-20 text-center font-black text-gray-300 uppercase tracking-widest italic">Mapa em breve</div>`;
        const renderTab3 = () => `<div class="p-20 text-center font-black text-gray-300 uppercase tracking-widest italic">Hospitais (Cadastrados no sistema)</div>`;
        const renderTab4 = () => `<div class="p-20 text-center font-black text-gray-300 uppercase tracking-widest italic">Máquinas (Configuração total)</div>`;

        onValue(ref(db, 'machines'), (snap) => { window.state.machines = snap.val() || {}; render(); });
        onValue(ref(db, 'history'), (snap) => { window.state.history = Object.values(snap.val() || {}); render(); });
        window.onload = render;
    </script>
    <style>
        @keyframes slide-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .animate-slide-up { animation: slide-up 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
    </style>
</head>
<body class="overscroll-none overflow-hidden"><div id="app"></div></body>
</html>
