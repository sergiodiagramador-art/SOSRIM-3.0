<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SOSRIM</title>
    <!-- ESTE LINK ABAIXO É O QUE FUNCIONOU NA TELA DE BEM-VINDO -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/8.10.0/firebase.js"></script>
    <style>
        :root { --blue: #2563eb; --green: #22c55e; --yellow: #facc15; --red: #ef4444; --purple: #a855f7; --bg: #f1f5f9; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: Arial, sans-serif; background: var(--bg); color: #1e3a8a; }
        header { background: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px; }
        .card { aspect-ratio: 1/1; border-radius: 20px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; text-align: center; color: white; font-weight: bold; border: none; }
        .card .time { font-size: 24px; font-weight: 900; }
        .verde { background: var(--green); } .amarelo { background: var(--yellow); color: black; } 
        .vermelho { background: var(--red); animation: pulse 1.5s infinite; } .azul { background: var(--blue); } .roxo { background: var(--purple); }
        @keyframes pulse { 50% { opacity: 0.6; } }
        nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; justify-content: space-around; padding: 10px 0 30px 0; border-top: 1px solid #eee; }
        nav button { border: none; background: none; color: #94a3b8; font-size: 10px; font-weight: bold; }
        nav .active { color: var(--blue); }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: flex-end; z-index: 100; }
        .modal-content { background: white; width: 100%; border-radius: 30px 30px 0 0; padding: 25px; }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        const config = {
            apiKey: "AIzaSyA896LR0DJv-TKqwt_DpkgO1MeaRKdKwP4",
            databaseURL: "https://sosrim-592ab-default-rtdb.firebaseio.com",
            projectId: "sosrim-592ab"
        };

        // INICIALIZAÇÃO SEGURA
        if (typeof firebase !== 'undefined') {
            firebase.initializeApp(config);
            const db = firebase.database();
            
            let state = {
                user: localStorage.getItem('sosrim_user'),
                machines: {}, hospitals: {}, history: [],
                tab: 1, editingId: null
            };

            function render() {
                const root = document.getElementById('app');
                if (!state.user) {
                    root.innerHTML = `<div style="padding:40px; text-align:center;"><h1 style="font-size:40px; font-weight:900; color:var(--blue);">SOSRIM</h1><p>Selecione seu nome:</p>\({['Sergio', 'Aderildo', 'Jairo'].map(n => `<button onclick="doLogin('\){n}')" style="width:100%; padding:20px; background:var(--blue); color:white; border:none; border-radius:20px; font-weight:900; font-size:18px; margin-bottom:10px;">${n}</button>`).join('')}</div>`;
                    return;
                }

                root.innerHTML = `
                    <header><b>SOSRIM 🚑</b><span onclick="doLogout()">${state.user} 🚪</span></header>
                    <main style="padding-bottom: 100px;">${renderTab()}</main>
                    <nav>
                        <button onclick="setTab(1)" class="${state.tab===1?'active':''}">PAINEL</button>
                        <button onclick="setTab(3)" class="${state.tab===3?'active':''}">HOSP</button>
                        <button onclick="setTab(4)" class="${state.tab===4?'active':''}">FROTA</button>
                        <button onclick="setTab(5)" class="${state.tab===5?'active':''}">RELAT</button>
                    </nav>
                    ${state.editingId ? renderModal() : ''}
                `;
            }

            function renderTab() {
                if (state.tab === 1) {
                    const maqs = Object.values(state.machines).sort((a,b)=>a.id-b.id);
                    return `<div class="grid">\({maqs.map(m => `<div class="card \){m.status}" onclick="openEdit('\({m.id}')"><div>#\){m.id}</div><div><div style="font-size:9px;">\({m.hospital || 'BASE'}</div><div class="time">\){m.time || '--:--'}</div></div></div>`).join('')}</div>`;
                }
                if (state.tab === 5) return `<div style="padding:20px;"><h2>Relatório</h2>\({state.history.slice().reverse().map(h => `<div style="border-bottom:1px solid #eee; padding:10px 0;"><small>\){h.driver} | \({h.timestamp}</small><br><b>\){h.details}</b></div>`).join('')}</div>`;
                return `<div style="padding:20px;">Use o botão azul para cadastrar máquinas/hospitais.</div>`;
            }

            function renderModal() {
                const m = state.machines[state.editingId];
                return `<div class="modal"><div class="modal-content">
                    <h3>MAQ #${m.id}</h3>
                    <button onclick="saveM('verde','BASE')" style="width:100%; padding:15px; background:var(--green); color:white; border:none; border-radius:15px; margin-bottom:10px; font-weight:bold;">BASE (VERDE)</button>
                    <button onclick="saveM('amarelo','RUA')" style="width:100%; padding:15px; background:var(--yellow); border:none; border-radius:15px; margin-bottom:10px; font-weight:bold;">RUA (AMARELO)</button>
                    <button onclick="saveM('vermelho','RECOLHER')" style="width:100%; padding:15px; background:var(--red); color:white; border:none; border-radius:15px; margin-bottom:10px; font-weight:bold;">RECOLHER (VERMELHO)</button>
                    <button onclick="closeEdit()" style="width:100%; padding:10px; background:none; border:none; color:#999;">CANCELAR</button>
                </div></div>`;
            }

            window.doLogin = (u) => { state.user = u; localStorage.setItem('sosrim_user', u); render(); };
            window.doLogout = () => { localStorage.clear(); location.reload(); };
            window.setTab = (t) => { state.tab = t; render(); };
            window.openEdit = (id) => { state.editingId = id; render(); };
            window.closeEdit = () => { state.editingId = null; render(); };
            window.saveM = (s, h) => {
                const time = new Date().toLocaleTimeString('pt-BR').slice(0,5);
                db.ref('machines/'+state.editingId).update({ status: s, hospital: h, time: time });
                db.ref('history').push({ driver: state.user, timestamp: time, details: `MAQ#\({state.editingId} -> \){h}` });
                state.editingId = null;
            };

            db.ref('machines').on('value', s => { state.machines = s.val() || {}; render(); });
            db.ref('history').on('value', s => { state.history = Object.values(s.val() || {}); render(); });
        } else {
            document.body.innerHTML = "Erro ao carregar banco de dados. Verifique sua rede.";
        }
    </script>
</body>
</html>
