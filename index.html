<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SOSRIM</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/8.10.0/firebase.js"></script>
    <style>
        body { margin: 0; font-family: sans-serif; background: #f1f5f9; color: #1e3a8a; }
        header { background: #fff; padding: 15px; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; justify-content: space-between; }
        .grid { display: block; padding: 10px; }
        .card { width: 30%; aspect-ratio: 1/1; float: left; margin: 1.5%; border-radius: 15px; color: white; text-align: center; font-weight: bold; padding: 10px; box-sizing: border-box; }
        .verde { background: #22c55e; } .amarelo { background: #facc15; color: black; } .vermelho { background: #ef4444; }
        .azul { background: #2563eb; } .roxo { background: #a855f7; }
        .time { font-size: 20px; display: block; margin-top: 5px; }
        nav { position: fixed; bottom: 0; width: 100%; background: #fff; display: flex; padding: 15px 0; border-top: 1px solid #ddd; }
        nav button { flex: 1; border: none; background: none; font-weight: bold; color: #64748b; font-size: 12px; }
        #debug { position: fixed; top: 0; left: 0; background: black; color: lime; font-size: 10px; width: 100%; z-index: 1000; display: none; padding: 5px; }
    </style>
</head>
<body>
    <div id="debug"></div>
    <div id="app">
        <div style="padding: 50px; text-align: center;">
            <h1>SOSRIM</h1>
            <p>Carregando sistema...</p>
        </div>
    </div>

    <script>
        // Função para mostrar erro na tela se tudo falhar
        window.onerror = function(msg, url, line) {
            var d = document.getElementById('debug');
            d.style.display = 'block';
            d.innerHTML = "ERRO: " + msg + " (Linha: " + line + ")";
        };

        var config = {
            apiKey: "AIzaSyA896LR0DJv-TKqwt_DpkgO1MeaRKdKwP4",
            databaseURL: "https://sosrim-592ab-default-rtdb.firebaseio.com",
            projectId: "sosrim-592ab"
        };

        var state = {
            user: localStorage.getItem('sos_user'),
            machines: {},
            tab: 1
        };

        function render() {
            var root = document.getElementById('app');
            
            // TELA DE LOGIN
            if (!state.user) {
                root.innerHTML = '<div style="padding:40px; text-align:center;">' +
                    '<h1 style="color:#2563eb; font-size:40px;">SOSRIM</h1>' +
                    '<p>Quem é você?</p>' +
                    '<button onclick="login(\'Sergio\')" style="width:100%; padding:20px; margin-bottom:10px; border-radius:15px; border:none; background:#2563eb; color:white; font-weight:bold; font-size:20px;">SERGIO</button>' +
                    '<button onclick="login(\'Aderildo\')" style="width:100%; padding:20px; margin-bottom:10px; border-radius:15px; border:none; background:#2563eb; color:white; font-weight:bold; font-size:20px;">ADERILDO</button>' +
                    '<button onclick="login(\'Jairo\')" style="width:100%; padding:20px; margin-bottom:10px; border-radius:15px; border:none; background:#2563eb; color:white; font-weight:bold; font-size:20px;">JAIRO</button>' +
                '</div>';
                return;
            }

            // PAINEL PRINCIPAL
            var html = '<header><span>SOSRIM 🚑</span><span onclick="logout()">' + state.user + ' 🚪</span></header>';
            html += '<div class="grid">';
            
            // Loop manual das máquinas (mais compatível)
            for (var id in state.machines) {
                var m = state.machines[id];
                html += '<div class="card ' + m.status + '" onclick="edit(\'' + id + '\')">' +
                    '<span style="font-size:10px;">#' + m.id + '</span>' +
                    '<span class="time">' + (m.time || '--:--') + '</span>' +
                '</div>';
            }
            
            html += '</div>';
            html += '<nav><button onclick="setTab(1)">PAINEL</button><button onclick="setTab(5)">RELATÓRIO</button></nav>';
            root.innerHTML = html;
        }

        // FUNÇÕES GLOBAIS
        window.login = function(u) { state.user = u; localStorage.setItem('sos_user', u); render(); };
        window.logout = function() { localStorage.clear(); location.reload(); };
        window.setTab = function(t) { state.tab = t; render(); };
        window.edit = function(id) {
            var status = prompt("Novo Status (verde, amarelo, vermelho, azul, roxo):", state.machines[id].status);
            if (status) {
                var t = new Date().toLocaleTimeString('pt-BR').slice(0,5);
                firebase.database().ref('machines/' + id).update({ status: status, time: t });
            }
        };

        // INICIAR FIREBASE
        if (typeof firebase !== 'undefined') {
            firebase.initializeApp(config);
            firebase.database().ref('machines').on('value', function(snap) {
                state.machines = snap.val() || {};
                render();
            });
        } else {
            document.getElementById('app').innerHTML = "<h1>Erro de Internet</h1><p>O Google está bloqueado.</p>";
        }

    </script>
</body>
</html>
