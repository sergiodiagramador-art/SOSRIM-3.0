<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SOSRIM CO-PILOTO</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/8.10.0/firebase.js"></script>
    <style>
        :root { 
            --bg-verde: #dcfce7; --btn-verde: #22c55e;
            --bg-amarelo: #fef9c3; --btn-amarelo: #facc15;
            --bg-vermelho: #fee2e2; --btn-vermelho: #ef4444;
            --bg-azul: #dbeafe; --btn-azul: #2563eb;
            --bg-roxo: #f3e8ff; --btn-roxo: #a855f7;
        }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #f1f5f9; padding-bottom: 120px; overflow-x: hidden; }
        header { background: #fff; padding: 15px; font-weight: bold; display: flex; justify-content: space-between; border-bottom: 1px solid #ddd; }
        
        /* GRID DESIGN NOVO */
        .grid { display: block; padding: 8px; overflow: hidden; }
        .card { 
            width: 30.33%; aspect-ratio: 1/1; float: left; margin: 1.5%; border-radius: 15px; 
            text-align: center; padding: 10px; box-sizing: border-box; 
            display: flex; flex-direction: column; justify-content: space-between; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); position: relative; border: 1px solid rgba(0,0,0,0.1);
        }
        .card .n-maq { font-size: 12px; font-weight: bold; opacity: 0.4; text-align: left; }
        .card .hosp-name { font-size: 13px; font-weight: 900; text-transform: uppercase; line-height: 1; word-wrap: break-word; }
        .card .time-val { font-size: 18px; font-weight: 900; color: #1e3a8a; }

        /* CORES DE STATUS */
        .verde { background: var(--bg-verde); } .amarelo { background: var(--bg-amarelo); }
        .vermelho { background: var(--bg-vermelho); } .azul { background: var(--bg-azul); } .roxo { background: var(--bg-roxo); }

        nav { position: fixed; bottom: 0; width: 100%; background: #fff; display: flex; padding: 15px 0 35px 0; border-top: 1px solid #ddd; z-index: 100; }
        nav button { flex: 1; border: none; background: none; font-weight: bold; color: #94a3b8; font-size: 10px; }
        nav .active { color: #2563eb; }

        .page { display: none; padding: 20px; } .page.active { display: block; }
        
        /* MODAL COM BOTÕES COLORIDOS */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: flex-end; z-index: 200; }
        .modal-content { background: white; width: 100%; border-radius: 30px 30px 0 0; padding: 25px; text-align: center; }
        .btn-status { width: 100%; padding: 18px; margin: 6px 0; border-radius: 15px; border: none; font-weight: bold; font-size: 16px; color: white; text-transform: uppercase; }
        
        input { width: 100%; padding: 15px; margin: 10px 0; border-radius: 12px; border: 1px solid #ccc; font-size: 18px; text-align: center; }
        .atrasado { border: 3px solid #ef4444 !important; animation: pulse 1s infinite; }
        @keyframes pulse { 50% { opacity: 0.7; } }
    </style>
</head>
<body>
    <div id="app">
        <header><span id="user-display">SOSRIM</span><span onclick="location.reload()">🔄</span></header>
        
        <div id="t1" class="page active"><div id="grid-maquinas" class="grid"></div></div>
        
        <div id="t2" class="page">
            <h2>GPS Ativo 📍</h2>
            <div id="gps-info" style="background:white; padding:20px; border-radius:15px;">Aguardando sinal...</div>
            <div id="lista-proximos" style="margin-top:20px;"></div>
        </div>

        <div id="t3" class="page">
            <h2>Hospitais</h2>
            <input id="h-nome" placeholder="Nome do Hospital">
            <button onclick="capturarPIN()" style="width:100%; padding:15px; background:#000; color:white; border-radius:12px; margin-bottom:10px;">📍 SALVAR PIN AQUI</button>
            <button onclick="addHosp()" style="width:100%; padding:15px; background:#2563eb; color:white; border-radius:12px;">SALVAR HOSPITAL</button>
            <div id="lista-hospitais" style="margin-top:20px;"></div>
        </div>

        <div id="t4" class="page">
            <h2>Frota</h2>
            <input id="m-id" type="number" placeholder="Nº da Máquina">
            <button onclick="addMaq()" style="width:100%; padding:15px; background:#2563eb; color:white; border-radius:12px;">CADASTRAR</button>
            <div id="lista-frota"></div>
        </div>

        <nav>
            <button id="b1" onclick="setTab(1)" class="active">PAINEL</button>
            <button id="b2" onclick="setTab(2)">GPS</button>
            <button id="b3" onclick="setTab(3)">HOSP</button>
            <button id="b4" onclick="setTab(4)">FROTA</button>
        </nav>
    </div>

    <div id="modal" class="modal" style="display:none;">
        <div class="modal-content">
            <h2 id="modal-title">MÁQUINA</h2>
            <input id="lib-horario" type="time">
            <div id="hosp-sel" style="display:flex; overflow-x:auto; gap:10px; padding:10px 0; margin-bottom:10px;"></div>
            
            <button onclick="confirmar('verde','BASE')" class="btn-status" style="background:var(--btn-verde)">BASE (VOLTOU)</button>
            <button onclick="confirmar('amarelo')" class="btn-status" style="background:var(--btn-amarelo); color:black;">AMARELO (DEIXAR)</button>
            <button onclick="confirmar('vermelho')" class="btn-status" style="background:var(--btn-vermelho)">VERMELHO (RETIRAR)</button>
            <button onclick="confirmar('azul')" class="btn-status" style="background:var(--btn-azul)">AZUL (SAINDO)</button>
            <button onclick="confirmar('roxo')" class="btn-status" style="background:var(--btn-roxo)">ROXO (VOLTANDO)</button>
            <button onclick="fechar()" style="background:none; border:none; color:#999; margin-top:10px;">CANCELAR</button>
        </div>
    </div>

    <script>
        var config = { apiKey: "AIzaSyA896LR0DJv-TKqwt_DpkgO1MeaRKdKwP4", databaseURL: "https://sosrim-592ab-default-rtdb.firebaseio.com", projectId: "sosrim-592ab" };
        firebase.initializeApp(config);
        var db = firebase.database();
        var user = localStorage.getItem('sos_user') || prompt("Seu Nome:");
        localStorage.setItem('sos_user', user);
        document.getElementById('user-display').innerText = user;

        var selId=null, selHosp="BASE", curLat=null, curLng=null, hospitais={};

        function setTab(n){ for(var i=1; i<=4; i++){ document.getElementById('t'+i).style.display=(i==n?'block':'none'); document.getElementById('b'+i).classList.toggle('active', i==n); } }
        function abrir(id, h, t){ selId=id; selHosp=h; document.getElementById('modal-title').innerText="MÁQUINA "+id; document.getElementById('lib-horario').value=t; document.getElementById('modal').style.display='flex'; }
        function fechar(){ document.getElementById('modal').style.display='none'; }
        
        function capturarPIN(){ navigator.geolocation.getCurrentPosition(function(p){ curLat=p.coords.latitude; curLng=p.coords.longitude; alert("PIN Capturado!"); }); }
        function addHosp(){ var n=document.getElementById('h-nome').value; if(n){ db.ref('hospitals').push({name:n, lat:curLat, lng:curLng}); document.getElementById('h-nome').value=''; } }
        function addMaq(){ var id=document.getElementById('m-id').value; if(id){ db.ref('machines/'+id).set({id:id, status:'verde', hospital:'BASE', time:'00:00'}); } }

        function confirmar(s, h){
            var time = document.getElementById('lib-horario').value;
            var hosp = h || selHosp;
            db.ref('machines/'+selId).update({status:s, hospital:hosp, time:time});
            db.ref('history').push({driver:user, msg:"MAQ "+selId+" -> "+hosp+" ["+s+"]", time:new Date().toLocaleString()});
            fechar();
        }

        function falar(t){ var m=new SpeechSynthesisUtterance(t); m.lang='pt-BR'; window.speechSynthesis.speak(m); }

        // MONITORAMENTO DE GPS (A cada 2 min)
        setInterval(function(){
            navigator.geolocation.getCurrentPosition(function(p){
                var lat=p.coords.latitude, lng=p.coords.longitude;
                document.getElementById('gps-info').innerText = "Localização: " + lat.toFixed(4) + "," + lng.toFixed(4);
                
                for(var id in hospitais){
                    var h = hospitais[id];
                    var dist = Math.sqrt(Math.pow(lat-h.lat,2) + Math.pow(lng-h.lng,2));
                    if(dist < 0.001){ // Perto do Hospital
                        if(h.name === "BASE") {
                            falar(user + ", você chegou na Base. Quer dar baixa nas máquinas que trouxe?");
                        } else {
                            falar(user + ", você está no " + h.name + ". Vai deixar ou retirar máquina?");
                        }
                        setTab(1); break;
                    }
                }
            });
        }, 120000);

        db.ref('machines').on('value', function(snap){
            var data=snap.val()||{}, grid=document.getElementById('grid-maquinas'), frota=document.getElementById('lista-frota');
            grid.innerHTML=''; frota.innerHTML='';
            var agora = new Date().toLocaleTimeString('pt-BR').slice(0,5);
            Object.keys(data).sort((a,b)=>a-b).forEach(function(id){
                var m=data[id];
                var atraso = (m.time != '00:00' && agora > m.time) ? 'atrasado' : '';
                grid.innerHTML += '<div class="card '+m.status+' '+atraso+'" onclick="abrir(\''+id+'\',\''+m.hospital+'\',\''+m.time+'\')"><span class="n-maq">'+id+'</span><span class="hosp-name">'+m.hospital+'</span><span class="time-val">'+m.time+'</span></div>';
                frota.innerHTML += '<div style="background:#fff;padding:10px;margin-bottom:5px;border-radius:10px;display:flex;justify-content:space-between;"><b>MAQ '+id+'</b><span onclick="db.ref(\'machines/'+id+'\').remove()" style="color:red">EXCLUIR</span></div>';
            });
        });

        db.ref('hospitals').on('value', function(snap){
            hospitais=snap.val()||{}; var lista=document.getElementById('lista-hospitais'), sel=document.getElementById('hosp-sel');
            lista.innerHTML=''; sel.innerHTML='';
            for(var id in hospitais){
                var h=hospitais[id];
                lista.innerHTML += '<div style="background:#fff;padding:10px;margin-bottom:5px;border-radius:10px;display:flex;justify-content:space-between;"><b>'+h.name+'</b><span onclick="db.ref(\'hospitals/'+id+'\').remove()" style="color:red">X</span></div>';
                sel.innerHTML += '<button onclick="selHosp=\''+h.name+'\';alert(\'Para: '+h.name+'\')" style="padding:10px;background:#eee;border:none;border-radius:10px;white-space:nowrap;font-weight:bold;">'+h.name+'</button>';
            }
        });
    </script>
</body>
</html>
