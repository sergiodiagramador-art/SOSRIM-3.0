<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOSRIM</title>
</head>
<body style="margin:0; font-family: sans-serif; background: #f3f4f6;">
    <div id="app">
        <div style="padding: 50px; text-align: center;">
            <h1 style="color: #1e3a8a;">SOSRIM</h1>
            <p>Carregando sistema...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, set, push, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // CONFIGURAÇÃO REAL DO SEU FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyB_REPLACE_WITH_REAL_KEY",
            authDomain: "sosrim-592ab.firebaseapp.com",
            databaseURL: "https://sosrim-592ab-default-rtdb.firebaseio.com",
            projectId: "sosrim-592ab"
        };

        try {
            const app = initializeApp(firebaseConfig);
            const db = getDatabase(app);

            let state = {
                user: localStorage.getItem('sosrim_user') || null,
                machines: {},
                history: [],
                tab: 1
            };

            function render() {
                const root = document.getElementById('app');
                
                // TELA DE LOGIN
                if (!state.user) {
                    root.innerHTML = `
                        <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;">
                            <div style="background: white; padding: 40px; border-radius: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; border-top: 10px solid #2563eb;">
                                <h1 style="margin: 0; font-size: 40px; color: #1e3a8a;">SOSRIM</h1>
                                <p style="color: #9ca3af; margin-bottom: 30px;">Selecione seu nome</p>
                                <button onclick="window.doLogin('Sergio')" style="width: 100%; padding: 20px; background: #2563eb; color: white; border: none; border-radius: 15px; font-size: 20px; font-weight: bold; margin-bottom: 10px; cursor: pointer;">SERGIO</button>
                                <button onclick="window.doLogin('Aderildo')" style="width: 100%; padding: 20px; background: #2563eb; color: white; border: none; border-radius: 15px; font-size: 20px; font-weight: bold; margin-bottom: 10px; cursor: pointer;">ADERILDO</button>
                                <button onclick="window.doLogin('Jairo')" style="width: 100%; padding: 20px; background: #2563eb; color: white; border: none; border-radius: 15px; font-size: 20px; font-weight: bold; cursor: pointer;">JAIRO</button>
                            </div>
                        </div>
                    `;
                    return;
                }

                // TELA PRINCIPAL
                const machines = Object.values(state.machines).sort((a,b) => a.id - b.id);
                
                root.innerHTML = `
                    <div style="min-height: 100vh; padding-bottom: 100px;">
                        <div style="background: white; padding: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
                            <b style="color: #1e3a8a; font-size: 24px;">SOSRIM 🚑</b>
                            <span style="background: #2563eb; color: white; padding: 5px 15px; border-radius: 20px; font-size: 12px; font-weight: bold;">${state.user.toUpperCase()}</span>
                        </div>

                        <div style="padding: 15px;">
                            ${state.tab === 1 ? `
                                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;">
                                    ${machines.map(m => `
                                        <div style="aspect-ratio: 1/1; border-radius: 15px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; color: \({m.status === 'amarelo' ? 'black' : 'white'}; background: \){m.status === 'verde' ? '#22c55e' : (m.status === 'amarelo' ? '#facc15' : (m.status === 'vermelho' ? '#ef4444' : (m.status === 'azul' ? '#3b82f6' : '#a855f7')))}">
                                            <b style="font-size: 10px; opacity: 0.7;">#${m.id}</b>
                                            <div style="text-align: center;">
                                                <div style="font-size: 9px; font-weight: bold; overflow: hidden; white-space: nowrap;">${m.hospital || 'BASE'}</div>
                                                <div style="font-size: 20px; font-weight: bold;">${m.time || '--:--'}</div>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            ` : `
                                <div style="background: white; padding: 20px; border-radius: 20px; min-height: 60vh;">
                                    <h2 style="border-bottom: 4px solid black; padding-bottom: 10px; color: #1e3a8a;">RESUMO</h2>
                                    ${state.history.slice().reverse().map(h => `
                                        <div style="border-bottom: 1px solid #eee; padding: 15px 0;">
                                            <small style="color: #9ca3af;">\({h.driver} • \){h.timestamp}</small>
                                            <div style="font-size: 16px; font-weight: bold; margin-top: 5px; text-transform: uppercase;">${h.details}</div>
                                        </div>
                                    `).join('')}
                                </div>
                            `}
                        </div>

                        <div style="position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; justify-content: space-around; padding: 20px; border-top: 1px solid #eee; box-shadow: 0 -5px 15px rgba(0,0,0,0.05);">
                            <button onclick="window.setTab(1)" style="border: none; background: \({state.tab === 1 ? '#eff6ff' : 'none'}; color: \){state.tab === 1 ? '#2563eb' : '#d1d5db'}; padding: 10px 20px; border-radius: 10px; font-weight: bold;">PAINEL</button>
                            <button onclick="window.setTab(2)" style="border: none; background: \({state.tab === 2 ? '#eff6ff' : 'none'}; color: \){state.tab === 2 ? '#2563eb' : '#d1d5db'}; padding: 10px 20px; border-radius: 10px; font-weight: bold;">RESUMO</button>
                        </div>
                    </div>
                `;
            }

            window.doLogin = (u) => { state.user = u; localStorage.setItem('sosrim_user', u); render(); };
            window.setTab = (t) => { state.tab = t; render(); };

            onValue(ref(db, 'machines'), (snap) => { state.machines = snap.val() || {}; render(); });
            onValue(ref(db, 'history'), (snap) => { state.history = Object.values(snap.val() || {}); render(); });
            
            render();
        } catch (e) {
            document.getElementById('app').innerHTML = "Erro de carregamento: " + e.message;
        }
    </script>
</body>
</html>
